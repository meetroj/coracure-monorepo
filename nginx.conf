server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached for a year; the page itself never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/providers/123) fall back to the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
